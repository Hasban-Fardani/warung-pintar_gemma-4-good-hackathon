<div class="bg-primary text-on-primary rounded-full w-10 h-10 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined" data-icon="smart_toy">smart_toy</span>
</div>
<div class="flex flex-col gap-stack-sm pt-1">
<p class="font-body-md text-body-md text-on-primary-fixed">

</div>

<div class="flex flex-col gap-unit">
<label class="font-label-lg text-label-lg text-on-surface" for="nama_warung">Nama Warung <span class="text-error">*</span></label>
<input class="h-touch-target-min px-margin-page border border-outline bg-surface rounded focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder-on-surface-variant" id="nama_warung" name="nama_warung" placeholder="Contoh: Warung Berkah" required="" type="text">
<p class="font-label-md text-label-md text-on-surface-variant">Nama ini akan tercetak di struk pelanggan.</p>
</div>
<!-- Contextual Hint -->
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-stack-md flex items-start gap-stack-sm">
<span class="material-symbols-outlined text-tertiary" data-icon="lightbulb">lightbulb</span>
<p class="font-label-md text-label-md text-on-surface-variant">

                </p>
</div>
