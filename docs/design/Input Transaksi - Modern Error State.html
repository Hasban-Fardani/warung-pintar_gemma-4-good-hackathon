<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Input Transaksi</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#88d982",
                        "primary-fixed": "#d4e3ff",
                        "surface-variant": "#e5e2e1",
                        "secondary-fixed": "#a3f69c",
                        "on-secondary-container": "#217128",
                        "outline": "#717783",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#001c3a",
                        "inverse-primary": "#a5c8ff",
                        "background": "#fcf9f8",
                        "surface-dim": "#dcd9d9",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#eae7e7",
                        "inverse-on-surface": "#f3f0ef",
                        "primary-container": "#1976d2",
                        "primary": "#005dac",
                        "outline-variant": "#c1c6d4",
                        "surface": "#fcf9f8",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e5e2e1",
                        "on-background": "#1c1b1b",
                        "on-tertiary-fixed": "#331200",
                        "on-primary-fixed-variant": "#004786",
                        "tertiary-fixed-dim": "#ffb68f",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#fffdff",
                        "surface-container-low": "#f6f3f2",
                        "on-tertiary-fixed-variant": "#773200",
                        "surface-tint": "#005faf",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#313030",
                        "surface-container": "#f0eded",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#fffdff",
                        "tertiary-container": "#c05600",
                        "tertiary": "#9a4300",
                        "on-secondary-fixed": "#002204",
                        "tertiary-fixed": "#ffdbca",
                        "secondary-container": "#a0f399",
                        "on-surface-variant": "#414752",
                        "on-surface": "#1c1b1b",
                        "surface-bright": "#fcf9f8",
                        "on-secondary-fixed-variant": "#005312",
                        "secondary": "#1b6d24",
                        "primary-fixed-dim": "#a5c8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "touch-target-min": "48px",
                        "gutter": "16px",
                        "unit": "8px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "margin-page": "16px"
                    },
                    "fontFamily": {
                        "label-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-md-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-lg": ["16px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col pt-[48px] pb-[80px]">
<!-- TopAppBar -->
<header class="bg-surface text-primary font-headline-sm text-headline-sm fixed top-0 w-full z-50 border-b border-outline-variant flat no shadows flex justify-between items-center px-margin-page h-touch-target-min">
<button class="h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="flex-1 text-center font-bold">Input Transaksi</h1>
<div class="w-touch-target-min h-touch-target-min"></div> <!-- Placeholder for balance -->
</header>
<!-- Error Banner -->
<div class="bg-surface-container-high text-error px-margin-page py-stack-sm sticky top-[48px] z-40 border-b border-outline-variant flex items-center gap-unit">
<span class="material-symbols-outlined" data-icon="error">error</span>
<span class="font-body-md text-body-md font-bold">Perbaiki 2 kesalahan</span>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-page py-stack-md flex flex-col gap-stack-lg">
<!-- Field 1 (No Error Example) -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="tanggal">Tanggal Transaksi</label>
<div class="relative">
<input class="w-full h-touch-target-min border border-outline px-stack-md font-body-lg text-body-lg text-on-surface bg-surface rounded-DEFAULT focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary disabled:opacity-50" disabled="" id="tanggal" type="date" value="2023-10-27"/>
</div>
</div>
<!-- Field 2 (Error) -->
<div class="flex flex-col gap-unit">
<label class="font-label-lg text-label-lg text-on-surface" for="nama_barang">Nama Barang <span class="text-error">*</span></label>
<div class="relative">
<input class="w-full h-touch-target-min border border-error bg-error-container/20 px-stack-md font-body-lg text-body-lg text-on-surface rounded-DEFAULT focus:outline-none focus:border-error focus:ring-1 focus:ring-error" id="nama_barang" placeholder="Masukkan nama barang" type="text"/>
</div>
<div class="flex flex-col gap-1 mt-1">
<p class="font-body-md text-body-md text-error flex items-start gap-unit">
<span class="material-symbols-outlined text-sm mt-1" data-icon="error">error</span>
                Nama barang harus diisi.
            </p>
<p class="font-body-md text-body-md text-on-surface-variant ml-6">Contoh: Mie Ayam</p>
</div>
</div>
<!-- Field 3 (Error) -->
<div class="flex flex-col gap-unit">
<label class="font-label-lg text-label-lg text-on-surface" for="jumlah">Jumlah <span class="text-error">*</span></label>
<div class="relative">
<input class="w-full h-touch-target-min border border-error bg-error-container/20 px-stack-md font-body-lg text-body-lg text-on-surface rounded-DEFAULT focus:outline-none focus:border-error focus:ring-1 focus:ring-error" id="jumlah" type="number" value="0"/>
</div>
<div class="flex flex-col gap-1 mt-1">
<p class="font-body-md text-body-md text-error flex items-start gap-unit">
<span class="material-symbols-outlined text-sm mt-1" data-icon="error">error</span>
                Jumlah harus angka minimal 1.
            </p>
<p class="font-body-md text-body-md text-on-surface-variant ml-6">Contoh: 1, 10, 100</p>
</div>
</div>
<!-- Field 4 (No Error Example) -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="harga">Harga Satuan (Rp)</label>
<div class="relative">
<input class="w-full h-touch-target-min border border-outline px-stack-md font-body-lg text-body-lg text-on-surface bg-surface rounded-DEFAULT focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" id="harga" placeholder="0" type="number"/>
</div>
</div>
</main>
<!-- Sticky Bottom Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-margin-page pb-stack-lg z-50">
<button class="w-full h-touch-target-min bg-surface-variant text-on-surface-variant font-label-lg text-label-lg font-bold rounded-full flex items-center justify-center cursor-not-allowed opacity-70 transition-opacity" disabled="">
            Simpan Transaksi
        </button>
</div>
</body></html>
