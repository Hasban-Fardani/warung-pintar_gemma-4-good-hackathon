<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg text-body-lg">
<!-- TopAppBar -->
<header class="w-full top-0 sticky border-b border-outline-variant bg-surface flex items-center h-[64px] px-margin-page justify-between z-10">
<div class="flex items-center gap-4">
<button aria-label="Kembali" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary hover:bg-surface-container-low active:bg-surface-container-high transition-colors duration-100 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm-mobile text-headline-sm-mobile font-bold text-primary">Update Stok</h1>
</div>
<button class="px-4 py-2 font-label-lg text-label-lg text-error hover:bg-error-container/20 rounded-DEFAULT">Batal</button>
</header>
<main class="flex-grow p-margin-page flex flex-col gap-stack-lg max-w-md mx-auto w-full">
<!-- Segmented Control -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-DEFAULT p-1 flex">
<button class="flex-1 h-[48px] bg-primary text-on-primary font-label-md text-label-md rounded-DEFAULT flex items-center justify-center transition-colors">
                Manual
            </button>
<button class="flex-1 h-[48px] text-on-surface-variant font-label-md text-label-md rounded-DEFAULT flex items-center justify-center hover:bg-surface-container-low transition-colors">
                Kamera
            </button>
<button class="flex-1 h-[48px] text-on-surface-variant font-label-md text-label-md rounded-DEFAULT flex items-center justify-center hover:bg-surface-container-low transition-colors">
                Suara
            </button>
</section>
<!-- Input Form Card -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-DEFAULT p-stack-md flex flex-col gap-stack-md">
<!-- Nama Barang -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="item-name">Nama Barang</label>
<div class="relative">
<input class="w-full h-touch-target-min pl-4 pr-12 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" id="item-name" readonly="" type="text" value="Mie Ayam — SKU: MIE-001">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
<!-- Stok Update -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface">Stok Setelah Update</label>
<div class="flex items-center gap-4">
<button aria-label="Kurangi" class="w-touch-target-min h-touch-target-min border border-outline-variant rounded-DEFAULT flex items-center justify-center text-primary bg-surface hover:bg-surface-container-low active:bg-surface-container-high">
<span class="material-symbols-outlined">remove</span>
</button>
<div class="flex-1 relative">
<input aria-label="Jumlah Stok" class="w-full h-touch-target-min text-center border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-headline-md-mobile text-headline-md-mobile tabular-nums focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" type="text" value="69">
<span class="absolute right-4 top-1/2 -translate-y-1/2 font-label-md text-label-md text-on-surface-variant">pcs</span>
</div>
<button aria-label="Tambah" class="w-touch-target-min h-touch-target-min border border-outline-variant rounded-DEFAULT flex items-center justify-center text-primary bg-surface hover:bg-surface-container-low active:bg-surface-container-high">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Catatan -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="notes">Catatan <span class="text-on-surface-variant font-normal">(Opsional)</span></label>
<textarea class="w-full p-4 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface font-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" id="notes" placeholder="Tambahkan alasan update..." rows="2"></textarea>
</div>
</section>
<!-- Pratinjau Section -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-lg text-label-lg text-on-surface">Pratinjau</h2>
<div class="bg-surface-container-low border border-outline-variant rounded-DEFAULT p-4 flex items-center justify-between min-h-[56px]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-primary-container text-on-primary-container rounded-DEFAULT flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">inventory_2</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface truncate max-w-[150px]">Mie Ayam</p>
<p class="font-body-md text-body-md text-on-surface-variant text-[12px]">SKU: MIE-001</p>
</div>
</div>
<div class="flex items-center gap-2 font-headline-sm-mobile text-headline-sm-mobile tabular-nums">
<span class="text-on-surface-variant line-through text-[16px]">45</span>
<span class="material-symbols-outlined text-primary text-[20px]">arrow_right_alt</span>
