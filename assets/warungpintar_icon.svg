<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <clipPath id="sq">
      <rect x="0" y="0" width="400" height="400" rx="88" ry="88"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F6FF"/>
    </linearGradient>
    <linearGradient id="awningBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="awningLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="storeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="counterTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="windowGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EFF6FF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="structShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
    <!-- Each lobe has its own gradient radiating from center outward -->
    <linearGradient id="gTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="gBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="400" height="400" fill="url(#bgGrad)"/>

    <rect x="68" y="118" width="264" height="18" rx="4" fill="#1E293B" filter="url(#structShadow)"/>
    <rect x="68" y="136" width="264" height="10" fill="url(#awningBlue)"/>
    <rect x="68" y="146" width="264" height="9"  fill="url(#awningLight)"/>
    <rect x="68" y="155" width="264" height="10" fill="url(#awningBlue)"/>
    <rect x="68" y="165" width="264" height="9"  fill="url(#awningLight)"/>
    <rect x="68" y="174" width="264" height="10" fill="url(#awningBlue)"/>
    <path d="M68,184 Q88,196 108,184 Q128,172 148,184 Q168,196 188,184 Q208,172 228,184 Q248,196 268,184 Q288,172 308,184 Q322,190 332,184 L332,184 L68,184 Z" fill="#1D4ED8"/>

    <rect x="68"  y="184" width="20"  height="118" fill="#334155"/>
    <rect x="312" y="184" width="20"  height="118" fill="#334155"/>
    <rect x="88"  y="184" width="224" height="118" fill="url(#storeBody)"/>

    <rect x="94" y="190" width="212" height="80" rx="4" fill="white" opacity="0.95"/>
    <rect x="94" y="190" width="212" height="80" rx="4" fill="url(#windowGlass)"/>
    <rect x="94" y="190" width="212" height="80" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

    <rect x="106" y="240" width="16" height="22" rx="2" fill="#BFDBFE" opacity="0.6"/>
    <rect x="128" y="235" width="14" height="27" rx="2" fill="#DDD6FE" opacity="0.5"/>
    <rect x="148" y="242" width="18" height="20" rx="2" fill="#BBF7D0" opacity="0.5"/>
    <rect x="100" y="262" width="90" height="2"  rx="1" fill="#CBD5E1"/>

    <rect x="68"  y="272" width="264" height="16" rx="2" fill="url(#counterTop)" filter="url(#structShadow)"/>
    <rect x="68"  y="288" width="264" height="14" fill="#64748B"/>
    <rect x="60"  y="302" width="280" height="8"  rx="4" fill="#1E293B"/>

    <!--
      SPARKLE centered at (258, 228)
      4 separate lobe paths, each a slim pointed petal
      going from center outward — exactly like reference:
      concave on both sides of each lobe = waist pinch
      Control points: tight near center axis, wide at mid-lobe
    -->
    <g transform="translate(258,228)" filter="url(#glow)">
      <!-- TOP lobe: tip at (0,-40), concave sides pinch inward -->
      <path d="M 0,0 C 9,-8 5,-26 0,-40 C -5,-26 -9,-8 0,0 Z" fill="url(#gTop)"/>
      <!-- RIGHT lobe: tip at (40,0) -->
      <path d="M 0,0 C 8,-9 26,-5 40,0 C 26,5 8,9 0,0 Z" fill="url(#gRight)"/>
      <!-- BOTTOM lobe: tip at (0,40) -->
      <path d="M 0,0 C 9,8 5,26 0,40 C -5,26 -9,8 0,0 Z" fill="url(#gBottom)"/>
      <!-- LEFT lobe: tip at (-40,0) -->
      <path d="M 0,0 C -8,-9 -26,-5 -40,0 C -26,5 -8,9 0,0 Z" fill="url(#gLeft)"/>
      <!-- Center bright dot -->
      <circle cx="0" cy="0" r="4.5" fill="white"/>
    </g>
  </g>

  <rect x="0" y="0" width="400" height="400" rx="88" ry="88"
    fill="none" stroke="#E2E8F0" stroke-width="2"/>
</svg>
